<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <main>
      <article class="card" data-qa="card">
        <div class="card__image">
        </div>

        <div class="card__body">
          <h3 class="card__title">APPLE A1419 iMac 27" Retina <br>
           5K (MNED2UA/A)
          </h3>
          <p class="card__product">Product code: 195434</p>
          <div class="card__star">
            <div class="stars stars--4" aria-hidden="true">
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
            </div>
            <p class="card__reviews">Reviews:5</p>
          </div>

          <div class="card__footer">
            <p class="card__price-left">Price</p>
            <p class="card__price-right">$2,199</p>
          </div>

          <a class="card__buy" href="#"
           data-qa = "hover">BUY</a>

        </div>
      </article>
    </main>
  </body>
</html>
